name: Release

# 推送 vX.Y.Z 标签（或手动指定标签）时校验版本、跑测试，并发布 GitHub Release。
# 发布说明取自 docs/CHANGELOG.md 中对应版本节，不写提交哈希。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，如 v0.3.0；手动触发时必须填写'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 确定版本标签
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "版本标签格式应为 vX.Y.Z，收到：$tag" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 pixi 环境
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: default
          cache: true

      - name: 校验版本并生成发布说明
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PYTHONIOENCODING: utf-8
        run: |
          cat > .release_notes.py <<'PY'
          import os
          import pathlib
          import tomllib

          version = os.environ["VERSION"]
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          actual = pyproject["project"]["version"]
          if actual != version:
              raise SystemExit(f"pyproject version {actual} does not match tag {version}")

          lines = pathlib.Path("docs/CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next(
              (i for i, line in enumerate(lines) if line.startswith(f"## v{version}（")),
              None,
          )
          if start is None:
              raise SystemExit(f"CHANGELOG has no section for v{version}")
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start + 1 : end]).strip()
          if not notes:
              raise SystemExit(f"release notes for v{version} are empty")
          pathlib.Path("release-body.md").write_text(notes + "\n", encoding="utf-8")
          print(f"release notes generated for v{version}")
          PY
          pixi run python .release_notes.py
          rm -f .release_notes.py

      - name: 运行测试
        shell: bash
        run: pixi run test

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-body.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: false
