# LLMTranslator 配置模板
# 复制为同目录下的 config.toml 后按需修改（该文件已被 .gitignore 忽略，可安全填写 api_key）。
# 各项含义见 README.md；生成参数「写了才发送」，注释掉即使用服务端默认值。

# ===== 翻译 =====
target_lang = "Chinese"
# 默认提示词：模型未写 prompt_template 时用它兜底
prompt_template = "将以下文本翻译为 {target_lang}，注意只需要输出翻译后的结果，不要额外解释：{input_text}"
stream = true
# OpenAI 兼容的流式请求是否请求服务端在末帧返回 token 统计。
# 若服务端不支持 stream_options 而报错（400），改成 false 即可只统计耗时。
stream_include_usage = true

# ===== 生成参数 =====
temperature = 0.7
top_p = 0.6
top_k = 20               # Ollama 扩展参数，严格校验的云端 API 可注释掉
repetition_penalty = 1.05  # 同上
max_tokens = 4096

# ===== 热键 =====
hotkey_translate = "<ctrl>+<shift>+e"
hotkey_quit = "<ctrl>+<shift>+q"

# ===== 弹窗 =====
tooltip_background_color = "#FFFFE0"
tooltip_text_color = "#000000"
tooltip_offset_x = 20
tooltip_offset_y = 20
tooltip_result_max_width = 30
tooltip_result_max_height = 8
tooltip_duration_ms = 1500

# ===== 其他 =====
restore_clipboard = false

# ===== 平台与模型（表格数组必须放在文件末尾，且先平台后模型，不能交叉）=====
# active_model 指定当前使用的模型名，留空则用第一个模型。
active_model = "example-cloud"

# 平台：API 地址与密钥。api_key 留空 → Ollama 原生格式，base_url 填 /api/generate 地址；
# api_key 非空 → OpenAI 兼容格式，base_url 填服务根地址（自动补全 /v1/chat/completions）。
# 建议用 https：http 被 301 到 https 时部分服务只接受 POST，方法改写会报错。
[[platforms]]
name = "example-paratera"
base_url = ""
api_key = ""

[[platforms]]
name = "example-ollama"
base_url = "http://localhost:11434/api/generate"
api_key = ""

# 模型：模型名与可选提示词，通过 platform 引用上面的平台名。
[[models]]
name = "example-cloud"
platform = "example-paratera"
model_name = ""
# prompt_template = "该模型专用提示词：{input_text}"
# extra_body 会原样合并进 OpenAI 兼容请求体（Ollama 原生格式忽略）。
# 例如关闭思考、缩短等待：extra_body = { thinking = { type = "disabled" } }

[[models]]
name = "example-local"
platform = "example-ollama"
model_name = "hy-mt"
# prompt_template = "<｜hy_begin▁of▁sentence｜>...{input_text}..."
