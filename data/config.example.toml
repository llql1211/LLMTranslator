# LLMTranslator 配置模板：复制为 config.toml 后按需填写。
# 字段说明见 docs/configuration.md；生成参数注释掉即使用服务端默认值。

# ===== 翻译 =====
target_lang = "Chinese"
prompt_template = "将以下文本翻译为 {target_lang}，注意只需要输出翻译后的结果，不要额外解释：{input_text}"
stream = true
stream_include_usage = true  # OpenAI 流式请求统计 token；服务端不支持 stream_options 时改为 false

# ===== 外观 =====
theme = "light"  # light / dark，重启后生效
# 主题专属配色（显式设置 theme 后使用）
tooltip_background_color_light = "#FFFFE0"
tooltip_text_color_light = "#000000"
tooltip_background_color_dark = "#2B2B2B"
tooltip_text_color_dark = "#EAEAEA"
tooltip_offset_x = 20
tooltip_offset_y = 20
tooltip_result_max_width = 30
tooltip_result_max_height = 8
tooltip_duration_ms = 1500
# 旧字段，仅未设置 theme 时生效
tooltip_background_color = "#FFFFE0"
tooltip_text_color = "#000000"

# ===== 生成参数 =====
temperature = 0.7
top_p = 0.6
top_k = 20                  # Ollama 扩展参数，严格校验的云端 API 可注释掉
repetition_penalty = 1.05   # 同上
max_tokens = 4096

# ===== 热键 =====
hotkey_translate = "<ctrl>+<shift>+e"
hotkey_quit = "<ctrl>+<shift>+q"

# ===== 其他 =====
restore_clipboard = false    # 翻译后是否恢复剪切板

# ===== 平台与模型（表格数组放在末尾，先平台后模型） =====
active_model = "example-cloud"

[[platforms]]
name = "example-paratera"
base_url = ""          # api_key 非空时填服务根地址，自动补全 /v1/chat/completions
api_key = ""

[[platforms]]
name = "example-ollama"
base_url = "http://localhost:11434/api/generate"  # api_key 留空时填此原生地址
api_key = ""

[[models]]
name = "example-cloud"
platform = "example-paratera"
model_name = ""
# prompt_template = "该模型专用提示词：{input_text}"
# extra_body = { thinking = { type = "disabled" } }  # 仅 OpenAI 兼容格式生效

[[models]]
name = "example-local"
platform = "example-ollama"
model_name = "hy-mt"
